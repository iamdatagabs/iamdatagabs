name: Atualizar indicadores do GitHub

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Consultar API do GitHub e atualizar JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_github_stats.py
      - name: Publicar indicadores atualizados
        run: |
          if [ ! -f portfolio/github-stats.json ] || ! git diff --quiet -- portfolio/github-stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio/github-stats.json
            git commit -m "chore: atualiza indicadores do GitHub"
            git push
          else
            echo "Indicadores sem alterações."
          fi
